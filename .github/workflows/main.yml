name: Capture Screenshot on PR

on:
  workflow_dispatch:  # Allows manual trigger from the Actions tab
  pull_request:       # Automatically runs on PRs
    types: [opened, synchronize, reopened]

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install Puppeteer and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev
          npm install puppeteer

      - name: Determine modified content file
        id: changed_file
        run: |
          FILE=$(git diff --name-only origin/production...HEAD | grep '^content/' | head -n 1)
          echo "Modified content file: $FILE"
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Build Hugo site
        run: hugo --minify

      - name: Start HTTP server
        run: |
          npx http-server ./public -p 8080 &
          sleep 5

      - name: Capture screenshot of modified page
        if: steps.changed_file.outputs.file != ''
        env:
          MODIFIED_FILE: ${{ steps.changed_file.outputs.file }}
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          const path = process.env.MODIFIED_FILE.replace(/^content/, '').replace(/\.md$/, '/');
          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox', '--disable-setuid-sandbox'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 800 });
            const url = 'http://localhost:8080' + path;
            console.log('Visiting: ' + url);
            await page.goto(url, { waitUntil: 'networkidle0' });
            await page.screenshot({ path: 'public/pr-screenshot.png', fullPage: true });
            await browser.close();
          })();"

      - name: Deploy to GitHub Pages (production branch)
        if: steps.changed_file.outputs.file != ''
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: production
          force_orphan: true

      - name: Comment on PR with embedded screenshot
        if: github.event.pull_request.number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO=${{ github.repository }}
          PR_NUMBER=${{ github.event.pull_request.number }}
          USERNAME=${REPO%%/*}
          REPO_NAME=${REPO##*/}
          PAGES_URL="https://${USERNAME}.github.io/${REPO_NAME}/pr-screenshot.png"

          gh api repos/$REPO/issues/$PR_NUMBER/comments \
            -f body="### 🖼️ Screenshot of modified page\n\n![Screenshot]($PAGES_URL)"

