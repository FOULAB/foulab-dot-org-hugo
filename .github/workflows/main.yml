name: Build and Screenshot Hugo Site

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Build Hugo site
        run: hugo --minify

      - name: Start HTTP server
        run: npx http-server ./public -p 8080 &
        continue-on-error: true

      - name: Wait for site to be ready
        run: |
          for i in {1..10}; do
            curl --silent --head http://localhost:8080 && break
            echo "Waiting for server..."
            sleep 1
          done

      - name: Capture full-page screenshot
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox', '--disable-setuid-sandbox'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 800 });
            await page.goto('http://localhost:8080', { waitUntil: 'networkidle0' });
            await page.screenshot({ path: 'screenshot.png', fullPage: true });
            await browser.close();
          })();
          "

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png

      - name: Download screenshot artifact
        uses: actions/download-artifact@v4
        with:
          name: screenshot
          path: .

      - name: Create PR comment with screenshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_BASE64=$(base64 -w 0 screenshot.png)
          COMMENT_BODY="### 🔍 Screenshot of Hugo site build\n\n![Screenshot](data:image/png;base64,${IMAGE_BASE64})"

          gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            -f body="$COMMENT_BODY"

