name: Build and Screenshot Hugo Site

on:
  pull_request:
    branches:
      - production
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # For deploying to production branch
      pull-requests: write  # For commenting on PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Build Hugo site
        run: hugo --minify

      - name: Start HTTP server
        run: npx http-server ./public -p 8080 &
        continue-on-error: true

      - name: Wait for site to be ready
        run: |
          for i in {1..10}; do
            curl --silent --head http://localhost:8080 && break
            echo "Waiting for server..."
            sleep 1
          done

      - name: Capture full-page screenshot
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox', '--disable-setuid-sandbox'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 800 });
            await page.goto('http://localhost:8080', { waitUntil: 'networkidle0' });
            await page.screenshot({ path: 'public/pr-screenshot.png', fullPage: true });
            await browser.close();
          })();
          "

      - name: Deploy to GitHub Pages (production branch)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: production
          force_orphan: true

      - name: Comment on PR with embedded screenshot
        if: github.event.pull_request.number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO=${{ github.repository }}
          PR_NUMBER=${{ github.event.pull_request.number }}
          USERNAME=${REPO%%/*}
          REPO_NAME=${REPO##*/}
          PAGES_URL="https://${USERNAME}.github.io/${REPO_NAME}/pr-screenshot.png"

          gh api repos/$REPO/issues/$PR_NUMBER/comments \
            -f body="### 🖼️ Screenshot of Hugo site build\n\n![Screenshot]($PAGES_URL)"

